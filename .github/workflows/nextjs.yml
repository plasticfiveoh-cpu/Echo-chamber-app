    { sender: 'user', text: "A chilling and pertinent risk. The standards would need decentralized scientific governance entirely isolated from executive partisan control." },
    { sender: 'opponent', text: "I appreciate you addressing that risk directly rather than dismissing state abuse as theoretical." }
  ]
