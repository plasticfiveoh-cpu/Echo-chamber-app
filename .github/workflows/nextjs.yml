/* Pre-scripted simulated dialogue cues based on active topics */
const SIMULATED_EXCHANGES = {
  'ai-governance': [
    { sender: 'user', text: "If we examine fiduciary failure, 78% of catastrophic capital losses stem from executive confirmation bias. An algorithmic governance model enforces strict expected-value calculations without ego." },
